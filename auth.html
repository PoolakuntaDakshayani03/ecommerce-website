<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ReFurnish - Login / Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

  <!-- Header -->
  <header class="w-full bg-blue-600 text-white p-4 shadow-md">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold">ReFurnish</h1>
      <nav class="space-x-4">
        <a href="index.html" class="hover:underline">Home</a>
        <a href="furniture.html" class="hover:underline">Shop</a>
        <a href="sell.html" class="hover:underline">Sell</a>
        <a href="cart.html" class="hover:underline">Cart</a>
        <a href="auth.html" class="hover:underline font-semibold underline">Login</a>
      </nav>
    </div>
  </header>

  <!-- Login/Register Form -->
  <main class="max-w-md mx-auto p-6 mt-10 bg-white rounded-xl shadow-lg">
    <h2 class="text-2xl font-bold mb-6 text-center">Login or Register</h2>
    
    <!-- Login Form -->
    <form id="login-form" class="space-y-4">
      <div>
        <label class="block font-medium mb-1">Email</label>
        <input type="email" placeholder="you@example.com" class="w-full p-2 border border-gray-300 rounded-lg" />
      </div>
      <div>
        <label class="block font-medium mb-1">Password</label>
        <input type="password" placeholder="Password" class="w-full p-2 border border-gray-300 rounded-lg" />
      </div>
      <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition">
        Log In
      </button>
    </form>

    <div class="text-center mt-4">
      <span class="text-gray-500">Don't have an account? </span>
      <button id="register-toggle" class="text-blue-600 hover:underline">Register here</button>
    </div>

    <!-- Register Form (Hidden by default) -->
    <form id="register-form" class="space-y-4 mt-8 hidden">
      <div>
        <label class="block font-medium mb-1">Full Name</label>
        <input type="text" placeholder="Your name" class="w-full p-2 border border-gray-300 rounded-lg" />
      </div>
      <div>
        <label class="block font-medium mb-1">Email</label>
        <input type="email" placeholder="you@example.com" class="w-full p-2 border border-gray-300 rounded-lg" />
      </div>
      <div>
        <label class="block font-medium mb-1">Password</label>
        <input type="password" placeholder="Password" class="w-full p-2 border border-gray-300 rounded-lg" />
      </div>
      <div>
        <label class="block font-medium mb-1">Confirm Password</label>
        <input type="password" placeholder="Confirm password" class="w-full p-2 border border-gray-300 rounded-lg" />
      </div>
      <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 transition">
        Register
      </button>
    </form>
  </main>

  <footer class="text-center text-gray-500 text-sm py-6 border-t mt-12">
    &copy; 2025 ReFurnish. All rights reserved.
  </footer>

  <script>
    const registerForm = document.getElementById('register-form');
    const loginForm = document.getElementById('login-form');
    const registerToggle = document.getElementById('register-toggle');
    
    registerToggle.addEventListener('click', () => {
      loginForm.classList.toggle('hidden');
      registerForm.classList.toggle('hidden');
      registerToggle.textContent = loginForm.classList.contains('hidden') ? 'Login here' : 'Register here';
    });
  </script>

</body>
</html>
