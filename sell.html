<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ReFurnish - Sell Furniture</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

  <!-- Header -->
  <header class="w-full bg-blue-600 text-white p-4 shadow-md">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold">ReFurnish</h1>
      <nav class="space-x-4">
        <a href="index.html" class="hover:underline">Home</a>
        <a href="furniture.html" class="hover:underline">Shop</a>
        <a href="sell.html" class="hover:underline font-semibold underline">Sell</a>
        <a href="cart.html" class="hover:underline">Cart</a>
        <a href="auth.html" class="hover:underline">Login</a>
      </nav>
    </div>
  </header>

  <!-- Form -->
  <main class="max-w-2xl mx-auto p-6 mt-10 bg-white rounded-xl shadow-lg">
    <h2 class="text-2xl font-bold mb-6 text-center">Sell Your Furniture</h2>
    <form>
      <div class="mb-4">
        <label class="block mb-1 font-medium">Full Name</label>
        <input type="text" placeholder="Your name" class="w-full p-2 border border-gray-300 rounded-lg" />
      </div>
      <div class="mb-4">
        <label class="block mb-1 font-medium">Email</label>
        <input type="email" placeholder="you@example.com" class="w-full p-2 border border-gray-300 rounded-lg" />
      </div>
      <div class="mb-4">
        <label class="block mb-1 font-medium">Phone Number</label>
        <input type="tel" placeholder="123-456-7890" class="w-full p-2 border border-gray-300 rounded-lg" />
      </div>
      <div class="mb-4">
        <label class="block mb-1 font-medium">Furniture Title</label>
        <input type="text" placeholder="e.g., Wooden Dining Table" class="w-full p-2 border border-gray-300 rounded-lg" />
      </div>
      <div class="mb-4">
        <label class="block mb-1 font-medium">Category</label>
        <select class="w-full p-2 border border-gray-300 rounded-lg">
          <option>Chair</option>
          <option>Table</option>
          <option>Sofa</option>
          <option>Cabinet</option>
          <option>Other</option>
        </select>
      </div>
      <div class="mb-4">
        <label class="block mb-1 font-medium">Expected Price (Rs.)</label>
        <input type="number" placeholder="e.g., 5000" class="w-full p-2 border border-gray-300 rounded-lg" />
      </div>
      <div class="mb-4">
        <label class="block mb-1 font-medium">Upload Photo</label>
        <input type="file" class="w-full p-2 border border-gray-300 rounded-lg" />
      </div>
      <div class="mb-6">
        <label class="block mb-1 font-medium">Additional Description</label>
        <textarea rows="4" class="w-full p-2 border border-gray-300 rounded-lg" placeholder="Details about the item..."></textarea>
      </div>
      <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 transition">
        Submit Furniture
      </button>
    </form>
  </main>

  <footer class="text-center text-gray-500 text-sm py-6 border-t mt-12">
    &copy; 2025 ReFurnish. All rights reserved.
  </footer>

</body>
</html>
