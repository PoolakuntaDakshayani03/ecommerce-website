<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ReFurnish - Your Cart</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Function to render the cart from localStorage
    function renderCart() {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      const cartContainer = document.getElementById('cart-items');
      const totalContainer = document.getElementById('total');
      let totalPrice = 0;

      cartContainer.innerHTML = ''; // Clear current cart items

      if (cart.length === 0) {
        cartContainer.innerHTML = '<p>Your cart is empty.</p>';
      } else {
        cart.forEach((item, index) => {
          totalPrice += item.price;

          cartContainer.innerHTML += `
            <div class="flex justify-between items-center border-b pb-4">
              <div class="flex items-center space-x-4">
                <img src="${item.image}" alt="${item.name}" class="w-24 h-24 object-cover rounded-lg" onerror="this.src='assets/placeholder.jpg'">
                <div>
                  <h3 class="font-semibold">${item.name}</h3>
                  <p class="text-gray-500">Rs. ${item.price}</p>
                </div>
              </div>
              <button onclick="removeFromCart(${index})" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition">
                Remove
              </button>
            </div>
          `;
        });
      }

      totalContainer.textContent = `Total: Rs. ${totalPrice}`;
    }

    // Function to remove items from the cart
    function removeFromCart(index) {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      cart.splice(index, 1); // Remove the item at the given index
      localStorage.setItem('cart', JSON.stringify(cart));
      renderCart();
    }

    // Load cart on page load
    window.onload = function() {
      renderCart();
    };
  </script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

  <!-- Header -->
  <header class="w-full bg-blue-600 text-white p-4 shadow-md">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold">ReFurnish</h1>
      <nav class="space-x-4">
        <a href="index.html" class="hover:underline">Home</a>
        <a href="furniture.html" class="hover:underline">Shop</a>
        <a href="sell.html" class="hover:underline">Sell</a>
        <a href="cart.html" class="hover:underline font-semibold underline">Cart</a>
      </nav>
    </div>
  </header>

  <!-- Cart Items -->
  <main class="max-w-6xl mx-auto p-6 mt-8 bg-white rounded-xl shadow-lg">
    <h2 class="text-3xl font-bold mb-6 text-center">Your Cart</h2>

    <div id="cart-items" class="space-y-6">
      <!-- Cart items will be displayed here -->
    </div>

    <div class="mt-8 flex justify-between items-center">
      <p id="total" class="text-xl font-semibold">Total: Rs. 0</p>
      <button class="bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700 transition">
        Checkout
      </button>
    </div>
  </main>

  <footer class="text-center text-gray-500 text-sm py-6 border-t mt-12">
    &copy; 2025 ReFurnish. All rights reserved.
  </footer>

  <script>
    // This will render the cart items on page load
    renderCart();
  </script>
</body>
</html>
