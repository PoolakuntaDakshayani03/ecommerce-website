<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ReFurnish - Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

  <!-- Header -->
  <header class="w-full bg-blue-600 text-white p-4 shadow-md">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold">ReFurnish Admin</h1>
      <nav class="space-x-4">
        <a href="admin.html" class="hover:underline font-semibold underline">Dashboard</a>
        <a href="furniture.html" class="hover:underline">Shop</a>
        <a href="sell.html" class="hover:underline">Sell</a>
        <a href="cart.html" class="hover:underline">Cart</a>
        <a href="auth.html" class="hover:underline">Logout</a>
      </nav>
    </div>
  </header>

  <!-- Admin Dashboard -->
  <main class="max-w-6xl mx-auto p-6 mt-10 bg-white rounded-xl shadow-lg">
    <h2 class="text-3xl font-bold mb-6 text-center">Manage Furniture Listings</h2>

    <!-- Add New Item Button -->
    <div class="text-center mb-8">
      <button class="bg-blue-600 text-white py-2 px-6 rounded-lg hover:bg-blue-700 transition">
        Add New Furniture
      </button>
    </div>

    <!-- Item List -->
    <div class="space-y-6">
      <!-- Item 1 -->
      <div class="flex justify-between items-center border-b pb-4">
        <div class="flex items-center space-x-4">
          <img src="img/sofa.jpg" alt="Vintage Sofa" class="w-24 h-24 object-cover rounded-lg">
          <div>
            <h3 class="font-semibold">Vintage Sofa</h3>
            <p class="text-gray-500">Rs. 12,000</p>
          </div>
        </div>
        <div>
          <button class="bg-yellow-500 text-white px-4 py-2 rounded-lg hover:bg-yellow-600 transition">
            Edit
          </button>
          <button class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition ml-2">
            Delete
          </button>
        </div>
      </div>

      <!-- Item 2 -->
      <div class="flex justify-between items-center border-b pb-4">
        <div class="flex items-center space-x-4">
          <img src="img/table.jpg" alt="Wooden Table" class="w-24 h-24 object-cover rounded-lg">
          <div>
            <h3 class="font-semibold">Wooden Dining Table</h3>
            <p class="text-gray-500">Rs. 7,500</p>
          </div>
        </div>
        <div>
          <button class="bg-yellow-500 text-white px-4 py-2 rounded-lg hover:bg-yellow-600 transition">
            Edit
          </button>
          <button class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition ml-2">
            Delete
          </button>
        </div>
      </div>

      <!-- Add more items as needed -->
    </div>
  </main>

  <footer class="text-center text-gray-500 text-sm py-6 border-t mt-12">
    &copy; 2025 ReFurnish. All rights reserved.
  </footer>

</body>
</html>
